<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: #FBF7F0; font-family: sans-serif; }
  .scene { position: absolute; inset: 0; opacity: 0; display: flex; align-items: center; justify-content: center; font-size: 96px; }
  .scene.active { opacity: 1; }
  .item { opacity: 0; }
  #sub { position: absolute; bottom: 80px; width: 100%; text-align: center; font-size: 56px; }
  #bar { position: absolute; bottom: 0; left: 0; height: 8px; background: #0891B2; }
</style>
</head>
<body>
<div class="scene" id="s0"><span class="item" data-delay="0.3">Scene 0</span></div>
<div class="scene" id="s1"><span class="item" data-delay="0.3">Scene 1</span></div>
<div class="scene" id="s2"><span class="item" data-delay="0.3">Scene 2</span></div>
<div class="scene" id="s3"><span class="item" data-delay="0.3">Scene 3</span></div>
<div class="scene" id="s4"><span class="item" data-delay="0.3">Scene 4</span></div>
<div class="scene" id="s5"><span class="item" data-delay="0.3">Scene 5</span></div>
<div id="sub"></div>
<div id="bar"></div>
<script>
// capture.py 会在加载后注入 window.SCENES（来自 scenes.json）和 window.SUBS（来自 VTT）。
// seekTo(t) 是 t 的纯函数：同一个 t 无论调用多少次、以什么顺序调用，结果都一致。
const FADE = 0.4;
function seekTo(t) {
  const scenes = window.SCENES || [];
  const total = scenes.length ? scenes[scenes.length - 1].end : 1;
  const cur = scenes.find(s => t >= s.start && t < s.end) || scenes[scenes.length - 1];
  document.querySelectorAll('.scene').forEach(el => el.classList.toggle('active', !!cur && el.id === cur.id));
  if (cur) {
    const local = t - cur.start;
    document.querySelectorAll('#' + cur.id + ' .item').forEach(el => {
      const p = Math.min(1, Math.max(0, (local - parseFloat(el.dataset.delay)) / FADE));
      el.style.opacity = p;
      el.style.transform = 'translateY(' + (30 * (1 - p)) + 'px)';
    });
  }
  const sub = (window.SUBS || []).find(s => t >= s[0] && t < s[1]);
  document.getElementById('sub').textContent = sub ? sub[2] : '';
  document.getElementById('bar').style.width = (t / total * 100) + '%';
}
window.seekTo = seekTo;
seekTo(0);
</script>
</body>
</html>
